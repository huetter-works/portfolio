    function dateKey(value) {
      if (value == null) return null;
      if (typeof value === 'string' && /^\d{4}-\d{2}-\d{2}/.test(value)) return value.slice(0, 10);
      const d = value instanceof Date ? value : new Date(value);
      if (Number.isNaN(d.getTime())) return null;
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + day;
    }

    function dateKeyToMs(key) {
      if (!key) return null;
      const t = Date.parse(key + 'T00:00:00');
      return Number.isFinite(t) ? t : null;
    }

    function plotTracesList() {
      if (allTracesData && Array.isArray(allTracesData.data)) return allTracesData.data;
      if (Array.isArray(allTracesData)) return allTracesData;
      return [];
    }

    function decodePlotlyArray(arr) {
      if (!arr) return [];
      if (Array.isArray(arr)) return arr;
      if (typeof Float64Array !== 'undefined' && arr instanceof Float64Array) return Array.from(arr);
      if (arr && typeof arr === 'object' && typeof arr.bdata === 'string') {
        const bin = atob(arr.bdata);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const dtype = String(arr.dtype || 'f8');
        let view;
        if (dtype === 'f8') view = new Float64Array(bytes.buffer);
        else if (dtype === 'f4') view = new Float32Array(bytes.buffer);
        else if (dtype === 'i4') view = new Int32Array(bytes.buffer);
        else return [];
        return Array.from(view, Number);
      }
      return [];
    }

    function traceXY(trace) {
      if (!trace) return { x: [], y: [] };
      const y = decodePlotlyArray(trace.y);
      const x = Array.isArray(trace.x) ? trace.x : decodePlotlyArray(trace.x);
      return { x, y };
    }

    function findTraceByLegendGroup(group) {
      const info = tracesInfo.find(i => i.legendgroup === group);
      if (!info || typeof info.originalTraceIndex !== 'number') return null;
      return plotTracesList()[info.originalTraceIndex] || null;
    }

    function lastNumericPoint(trace) {
      const { x, y } = traceXY(trace);
      for (let i = y.length - 1; i >= 0; i--) {
        const v = Number(y[i]);
        if (!Number.isFinite(v)) continue;
        return { date: dateKey(x[i]), value: v };
      }
      return { date: null, value: null };
    }

    function valueNearDate(trace, dateStr) {
      const target = dateKeyToMs(dateKey(dateStr));
      const { x, y } = traceXY(trace);
      if (target == null || !y.length) return null;
      let best = null;
      let bestAbs = Infinity;
      for (let i = 0; i < y.length; i++) {
        const v = Number(y[i]);
        const ms = dateKeyToMs(dateKey(x[i]));
        if (!Number.isFinite(v) || ms == null) continue;
        const d = Math.abs(ms - target);
        if (d < bestAbs) {
          bestAbs = d;
          best = v;
        }
      }
      if (bestAbs > 2 * 86400000) return null;
      return best;
    }

    function describeRankVsOverall(indiv, overall) {
      if (typeof indiv !== 'number' || typeof overall !== 'number') return '確認できません';
      const diff = indiv - overall;
      const threshold = Math.max(1000, Math.abs(overall) * 0.05);
      if (Math.abs(diff) < threshold) {
        return '全体中央とほぼ同水準（差 ' + (formatNumber(diff, 0) || String(diff)) + '）';
      }
      if (diff < 0) return '全体より上位（差 ' + (formatNumber(diff, 0) || String(diff)) + '。負＝より良い順位）';
      return '全体より下位（差 ' + (formatNumber(diff, 0) || String(diff)) + '。正＝より弱い順位）';
    }

    function describeMoveVsOverall(i0, i1, o0, o1) {
      if ([i0, i1, o0, o1].some(v => typeof v !== 'number')) return '確認できません';
      const iD = i1 - i0;
      const oD = o1 - o0;
      const dir = (d) => (d < -1 ? '改善' : (d > 1 ? '悪化' : '横ばい'));
      const iTxt = dir(iD);
      const oTxt = dir(oD);
      let rel = '全体と同じ向き（全体流れの可能性）';
      if (iTxt === '改善' && oTxt !== '改善') rel = '全体と独立して改善（固有の強さの可能性）';
      else if (iTxt === '悪化' && oTxt !== '悪化') rel = '全体と独立して悪化';
      else if (iTxt === '横ばい' && oTxt === '横ばい') rel = '両方とも横ばい';
      return '個別 ' + iTxt + '（' + (formatNumber(iD, 0) || String(iD)) + '）／全体 ' + oTxt + '（' + (formatNumber(oD, 0) || String(oD)) + '）→ ' + rel;
    }

    function buildOverallCompareLines(info) {
      const actualTrace = findTraceByLegendGroup('OverallActual');
      const predTrace = findTraceByLegendGroup('OverallPredicted');
      if (!actualTrace && !predTrace) {
        return [
          '■ 全体中央との比較',
          '- 全体中央トレースがありません',
        ];
      }
      const ra = info.recentActualSummary || {};
      const fp = info.futurePredictedSummary || {};
      const ovActAtEnd = valueNearDate(actualTrace, ra.end_date);
      const ovActAtStart = valueNearDate(actualTrace, ra.start_date);
      const ovPredAtEnd = valueNearDate(predTrace, fp.end_date);
      return [
        '■ 全体中央との比較（グラフ母集団の同じ日の中央値。販売冊数ではない）',
        '- 全体 実績中央（' + (ra.end_date || 'N/A') + '）: ' + (formatNumber(ovActAtEnd, 0) || 'N/A') + '位',
        '- 個別 実績終端: ' + (formatNumber(ra.end_ranking, 0) || 'N/A') + '位',
        '- 実績の位置: ' + describeRankVsOverall(ra.end_ranking, ovActAtEnd),
        '- 全体 予測中央（' + (fp.end_date || 'N/A') + '）: ' + (formatNumber(ovPredAtEnd, 0) || 'N/A') + '位',
        '- 個別 将来終端予測: ' + (formatNumber(fp.end_ranking, 0) || 'N/A') + '位',
        '- 予測の位置: ' + describeRankVsOverall(fp.end_ranking, ovPredAtEnd),
        '- 直近窓の動き: ' + describeMoveVsOverall(ra.start_ranking, ra.end_ranking, ovActAtStart, ovActAtEnd),
        '- 個別だけ上位へ動けば相対的に強い。全体と同じ向き・同じ幅なら全体流れの可能性。冊数とは読まない',
      ];
    }

    function buildIndividualRuleSummary(info) {
      const verdict = buildProcurementVerdict(info);
      const ra = info.recentActualSummary || {};
      const fp = info.futurePredictedSummary || {};
      const ph = info.priceHistorySummary || {};
      const slopeDir = slopeLabelDirection(info.trendCategory, info.predictedSlope);
      const futureDir = rankWindowDirection(fp.start_ranking, fp.end_ranking);
      const conflictNote = (slopeDir && futureDir && slopeDir !== futureDir)
        ? `矛盾注記: 傾きラベルは「${slopeDir}」だが、将来ウィンドウ始終は「${futureDir}」。消して整合させない。`
        : '矛盾注記: なし';
      const lines = [
        '【定型サマリー】API不使用・参考判定',
        '',
        `商品: ${info.productName || 'N/A'}`,
        `ASIN: ${info.asin || 'N/A'}`,
        `カテゴリ: ${(info.allCategories && info.allCategories.length) ? info.allCategories.join(', ') : 'N/A'}`,
        `最新実績の取得元カテゴリ（最新1点）: ${info.actualCategory || 'N/A'}`,
        `最新価格: ${formatNumber(info.latestPrice, 0, true) || 'N/A'}`,
        `アラート: ${formatAlertLabels(info.asin)}`,
        '',
        `■ 定型判定: ${verdict.label}`,
        `- 観測可能性: ${verdict.observability || 'N/A'}`,
        verdict.wait_note ? `- 様子見注記: ${verdict.wait_note}` : '',
        `- 水準: ${verdict.level_reason || 'N/A'}`,
        `- トレンド: ${verdict.trend_reason || 'N/A'}`,
        `- 供給信頼度: ${verdict.supply_reason || 'N/A'}`,
        verdict.read_guard ? `- 読み方: ${verdict.read_guard}` : '',
        '- 注目並びは推定GMV（仮説）。本判定は別ヒューリスティック。',
        info.convertible
          ? `- 推定週販（仮説）: ${formatNumber(info.weeklyLow, 2) || 'N/A'} 〜 ${formatNumber(info.weeklyHigh, 2) || 'N/A'} セット/週`
          : '- 換算対象外（単巻等）。推定週販・GMVは出さない',
        info.convertible
          ? `- 推定GMV（仮説・下限〜上限）: ${formatNumber(info.displayGmvLow, 0, true) || 'N/A'} 〜 ${formatNumber(info.displayGmvHigh, 0, true) || 'N/A'}`
          : '- 推定GMV: 入力なし',
        info.waitingRestock ? '- フラグ: 入荷待ち（供給制約中の価格急騰はソート加点なし）' : '',
        info.alertDrop ? '- フラグ: 警戒（推定GMV急落・仮説）' : '',
        info.alertUndetermined ? '- 警戒: 判定不能（有効点が不足）' : '',
        info.growth ? '- フラグ: 伸び（予測平均順位が換算帯を上へまたぎ）' : '',
        info.shrink ? '- フラグ: 縮小注意' : '',
        (info.mediaHits && info.mediaHits.length)
          ? `- メディア化: ${info.mediaHits.map(h => `${h.label || ''}(${h.media_type || ''}／${h.window || ''})`).join(' / ')}`
          : '- メディア化: 入力なし',
        ...(verdict.reasons || []).filter((r) =>
          !String(r).startsWith('水準:') &&
          !String(r).startsWith('トレンド:') &&
          !String(r).startsWith('供給信頼度:')
        ).map(r => `- ${r}`),
        '',
        '■ 実績（直近・最大30有効観測点）',
        `- ${formatWindowCaption(ra, '期間')}`,
        `- 開始 / 終了: ${formatNumber(ra.start_ranking) || 'N/A'}位 〜 ${formatNumber(ra.end_ranking) || 'N/A'}位`,
        `- 最小 / 最大 / 中央値: ${formatNumber(ra.min_ranking) || 'N/A'} / ${formatNumber(ra.max_ranking) || 'N/A'} / ${formatNumber(ra.median_ranking) || 'N/A'}`,
        `- 実績傾き: ${formatNumber(ra.recent_slope, 2) || 'N/A'}`,
        `- 最新実績順位: ${formatNumber(info.latestActualRank) || 'N/A'}`,
        '',
        ...buildOverallCompareLines(info),
        '',
        '■ 予測',
        `- 傾向: ${info.trendCategory || 'N/A'} / 傾き: ${formatNumber(info.predictedSlope, 2) || 'N/A'}`,
        `- 最新予測順位: ${formatNumber(info.latestPredictedRank) || 'N/A'}`,
        `- ${formatWindowCaption(fp, '将来')}`,
        `- 将来 点予測 開始 / 終了: ${formatNumber(fp.start_ranking) || 'N/A'}位 〜 ${formatNumber(fp.end_ranking) || 'N/A'}位`,
        `- 将来 点予測 最小 / 最大 / 平均: ${formatNumber(fp.min_ranking) || 'N/A'} / ${formatNumber(fp.max_ranking) || 'N/A'} / ${formatNumber(fp.average_ranking) || 'N/A'}`,
        `- モデル区間（中央）: ${formatNumber(fp.interval_lower_median) || 'N/A'} 〜 ${formatNumber(fp.interval_upper_median) || 'N/A'}（点予測の幅とは別）`,
        `- モデル区間（終端）: ${formatNumber(fp.interval_lower_end) || 'N/A'} 〜 ${formatNumber(fp.interval_upper_end) || 'N/A'}`,
        `- ${conflictNote}`,
        '',
        '■ 価格履歴（有効観測・最大30点）',
        `- ${formatWindowCaption(ph, '期間')}`,
        `- 開始: ${ph.start_date || 'N/A'} ${formatNumber(ph.start_price, 0, true) || 'N/A'} / 終了: ${ph.end_date || 'N/A'} ${formatNumber(ph.end_price, 0, true) || 'N/A'}`,
        `- 最低 / 最高 / 平均: ${formatNumber(ph.min_price, 0, true) || 'N/A'} / ${formatNumber(ph.max_price, 0, true) || 'N/A'} / ${formatNumber(ph.average_price, 0, true) || 'N/A'}`,
        '',
        '■ 次の確認',
        '- 供給制約中なら入荷・価格の見極めを優先',
        '- 詳細な文章化が必要なら「プロンプトをコピー」を利用',
        '- 仕入れ個数は出さない。推定GMVは仮説であり実売ではない',
      ];
      return lines.join('\n');
    }

    function collectOverallStats() {
      let totalAsins = 0;
      let risingAsinsCount = 0;
      let decliningAsinsCount = 0;
      let stableAsinsCount = 0;
      let supplyCount = 0;
      let restockCount = 0;
      let attentionConvertible = 0;
      let alertDropCount = 0;
      let growthCount = 0;
      const slopes = [];
      const processedAsinsForOverall = new Set();

      tracesInfo.forEach(info => {
        if (
          info.asin
          && info.legendgroup !== 'OverallActual'
          && info.legendgroup !== 'OverallPredicted'
          && !info.isActualData
          && !info.isPredictionInterval
          && !info.isInSampleFit
          && !info.isAlert
          && !info.isHistogram
          && !processedAsinsForOverall.has(info.asin)
        ) {
          processedAsinsForOverall.add(info.asin);
          totalAsins++;
          if (info.trendCategory === '上昇') risingAsinsCount++;
          else if (info.trendCategory === '下降') decliningAsinsCount++;
          else if (info.trendCategory === '維持') stableAsinsCount++;
          if (info.predictedSlope !== undefined && info.predictedSlope !== null) {
            slopes.push(info.predictedSlope);
          }
          const alerts = getAsinAlertTypes(info.asin);
          if (alerts.includes('SUPPLY_CONSTRAINED')) supplyCount++;
          if (alerts.includes('RESTOCK_OPPORTUNITY')) restockCount++;
          if (info.convertible) attentionConvertible++;
          if (info.alertDrop) alertDropCount++;
          if (info.growth) growthCount++;
        }
      });

      return {
        totalAsins,
        risingAsinsCount,
        decliningAsinsCount,
        stableAsinsCount,
        supplyCount,
        restockCount,
        attentionConvertible,
        alertDropCount,
        growthCount,
        minSlope: slopes.length ? Math.min(...slopes) : null,
        maxSlope: slopes.length ? Math.max(...slopes) : null,
      };
    }

    function buildOverallRuleSummary(stats) {
      let posture = '選別時';
      if (stats.risingAsinsCount > stats.decliningAsinsCount * 1.5 && stats.risingAsinsCount >= 3) {
        posture = '攻め寄り';
      } else if (stats.decliningAsinsCount > stats.risingAsinsCount * 1.5 && stats.decliningAsinsCount >= 3) {
        posture = '守り寄り';
      }
      const lines = [
        '【全体 定型サマリー】API不使用・参考判定',
        '',
        '母集団: グラフ生成時の全プロットASIN（画面フィルタ／フォーカス後ではない）',
        `分析対象ASIN数: ${formatNumber(stats.totalAsins) || 0}`,
        `上昇: ${formatNumber(stats.risingAsinsCount) || 0} / 下降: ${formatNumber(stats.decliningAsinsCount) || 0} / 維持: ${formatNumber(stats.stableAsinsCount) || 0}`,
        `予測傾きの範囲: ${formatNumber(stats.minSlope, 2) || 'N/A'} 〜 ${formatNumber(stats.maxSlope, 2) || 'N/A'}`,
        `供給制約アラート: ${formatNumber(stats.supplyCount) || 0} / 入荷機会: ${formatNumber(stats.restockCount) || 0}`,
        `換算対象（セット）: ${formatNumber(stats.attentionConvertible) || 0} / 警戒: ${formatNumber(stats.alertDropCount) || 0} / 伸び: ${formatNumber(stats.growthCount) || 0}`,
        '',
        `■ 定型判定: ${posture}`,
        '- 上昇・下降の件数比とアラート件数から機械的に付与（確定判断ではない）',
        '- 上昇件数は人気の絶対的上昇を意味しない',
        '- 注目並びは推定GMV下限（仮説）。本判定は上昇／下降件数の別ヒューリスティック。GMV合計は出さない',
        '- 個別タイトルの買い判定はしない',
        '',
        '■ 優先して見る候補',
        '- フォーカス「入荷」「供給×上位」で件数を絞る',
        '- 一覧の■▲と中央値順位で当たりをつける',
        '- 個別「分析」で定型サマリー → 必要ならプロンプトをコピー',
      ];
      return lines.join('\n');
    }

    function generateIndividualTrendInsight(asin) {
      const targetTraceInfo = tracesInfo.find(info =>
        info.asin === asin
        && !info.isActualData
        && !info.isPredictionInterval
        && !info.isAlert
        && !info.isHistogram
        && !info.isInSampleFit
      );

      if (!targetTraceInfo) {
        showInsightModal('分析', `指定されたASIN (${asin}) のデータがグラフに見つかりませんでした。`, '');
        return;
      }

      const summary = buildIndividualRuleSummary(targetTraceInfo);
      const promptText = populatePromptTemplate(geminiIndividualPromptTemplate, summary, targetTraceInfo);
      showInsightModal(`分析: ${targetTraceInfo.asin}`, summary, promptText);
    }

    function generateOverallTrendInsight() {
      const overallStats = collectOverallStats();
      const summary = buildOverallRuleSummary(overallStats);
      const promptText = populatePromptTemplate(geminiOverallPromptTemplate, summary);
      showInsightModal('トレンド分析（全体）', summary, promptText);
    }
    // --- NEW: Y軸スケール切り替え関数 ---
    function toggleYAxisScale() {
      const gd = document.getElementById('dummy-plotly-graph');
      if (!gd || !gd.layout) return;
      const scaleToggleButton = document.getElementById('scaleToggleButton');

      let newYAxisConfig;

      if (yAxisIsLog) {
        // 対数スケールから線形スケールへ
        newYAxisConfig = {
          type: 'linear',
          autorange: 'reversed', // 常に逆順
          tickformat: ',.0f'
        };
        yAxisIsLog = false;
        if (scaleToggleButton) scaleToggleButton.textContent = '対数';
      } else {
        // 線形スケールから対数スケールへ
        newYAxisConfig = {
          type: 'log',
          autorange: 'reversed', // 常に逆順
          tickformat: ',.0f'
        };
        yAxisIsLog = true;
        if (scaleToggleButton) scaleToggleButton.textContent = '線形';
      }
      // 現在のビューに応じて適切なY軸を更新
      const yAxisKey = (currentGraphView === 'timeseries') ? 'yaxis' : 'xaxis'; // ヒストグラムはX軸がランキング
      // グラフがヒストグラムの場合はY軸のスケール変更は行わない
      if (currentGraphView === 'timeseries') {
        Plotly.relayout(gd, { 'yaxis.type': yAxisIsLog ? 'log' : 'linear' });
      }
    }
    // --- ここまで ---
  </script>
